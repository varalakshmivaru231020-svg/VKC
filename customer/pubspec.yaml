name: vkc_customer
description: "VKC Gold customer shopping app — pure cane jaggery."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.6.3
  dio: ^5.7.0
  intl: ^0.19.0
  shimmer: ^3.0.0
  webview_flutter: ^4.10.0        # embed YouTube / Instagram / Facebook live
  google_fonts: ^6.2.1            # Cormorant Garamond + Poppins + Inter
  flutter_secure_storage: ^9.2.2  # ecom auth tokens (access + refresh)
  url_launcher: ^6.3.1            # courier tracking, WhatsApp/call/mail, socials
  razorpay_flutter: ^1.4.5        # native Razorpay checkout (store admin toggle)
  share_plus: ^12.0.2
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
