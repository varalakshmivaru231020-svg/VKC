name: vkc_customer
description: "VKC Gold Ikshu customer shopping app — pure cane jaggery from Mandya."
publish_to: 'none'
version: 1.4.1+13

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.6.3
  dio: ^5.7.0
  intl: ^0.19.0
  shimmer: ^3.0.0
  webview_flutter: ^4.10.0        # About Us / Leadership website pages, hosted payment pages
  google_fonts: ^6.2.1            # Cormorant Garamond + Poppins + Inter
  flutter_secure_storage: ^9.2.2  # ecom auth tokens (access + refresh)
  url_launcher: ^6.3.1            # courier tracking, WhatsApp/call/mail, socials
  razorpay_flutter: ^1.4.5        # native Razorpay checkout (store admin toggle)
  share_plus: ^12.0.2
  cached_network_image: ^3.4.1    # disk + memory image cache for products, banners, gallery
  shared_preferences: ^2.3.3      # local cart + recent searches
  firebase_core: ^3.8.0           # push notifications (needs android/app/google-services.json)
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1  # shows a push while the app is open

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
