name: vijaylakshmi_app
description: "Vijaylakshmi Sarees mobile app — Android & iOS"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management & DI
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.7

  # Networking
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^6.0.5

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: 2.2.3
  shared_preferences_android: 2.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  # UI
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  carousel_slider: ^5.0.0
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.0+3
  pinput: ^5.0.0
  intl: ^0.19.0

  # Pagination
  infinite_scroll_pagination: ^4.0.0

  # Utilities
  url_launcher: ^6.3.0
  share_plus: ^10.0.2
  package_info_plus: ^8.0.2
  permission_handler: ^11.3.1

  # Payments
  razorpay_flutter: ^1.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Native splash + launcher icon generation
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/

# Run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FBF8F3"
  adaptive_icon_foreground: "assets/icon/app_icon_fg.png"

# Run: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FBF8F3"
  image: "assets/icon/splash_logo.png"
  android_12:
    color: "#FBF8F3"
    image: "assets/icon/splash_logo.png"
